<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">Anju Barai — MIS Analyst, Data Analyst, Automation</title>
  <desc id="d">Animated banner with name, role and rotating taglines next to a small live-style dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset=".55" stop-color="#0F1733"/>
      <stop offset="1" stop-color="#1A1240"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowC"><stop offset="0" stop-color="#22D3EE" stop-opacity=".28"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowV"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".30"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,'Courier New',monospace}
    .in{opacity:0;animation:in .9s cubic-bezier(.2,.7,.2,1) forwards}
    .d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}.d4{animation-delay:1s}
    @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .tag{opacity:0;animation:cyc 9s infinite}
    .g2{animation-delay:3s}.g3{animation-delay:6s}
    @keyframes cyc{0%{opacity:0;transform:translateY(10px)}5%,29%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-10px)}}
    .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 2.8s ease-in-out infinite alternate}
    .b2{animation-delay:.35s}.b3{animation-delay:.7s}.b4{animation-delay:1.05s}.b5{animation-delay:1.4s}.b6{animation-delay:1.75s}
    @keyframes grow{0%{transform:scaleY(.45)}100%{transform:scaleY(1)}}
    .line{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 6s ease-in-out infinite}
    @keyframes draw{0%{stroke-dashoffset:420}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .drift{animation:drift 14s ease-in-out infinite alternate}
    @keyframes drift{to{transform:translate(40px,18px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.g1{opacity:1}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle class="drift" cx="140" cy="40" r="260" fill="url(#glowC)"/>
    <circle class="drift" cx="1080" cy="320" r="300" fill="url(#glowV)" style="animation-direction:alternate-reverse"/>

    <!-- floating data points -->
    <g fill="#67E8F9" opacity=".55">
      <circle cx="0" cy="0" r="2"><animateMotion dur="11s" repeatCount="indefinite" path="M-10 300 C 200 240 380 330 640 260 S 1000 200 1210 250"/></circle>
      <circle cx="0" cy="0" r="1.6"><animateMotion dur="15s" begin="-5s" repeatCount="indefinite" path="M-10 80 C 260 140 420 40 700 110 S 1000 60 1210 120"/></circle>
      <circle cx="0" cy="0" r="1.8" fill="#C4B5FD"><animateMotion dur="13s" begin="-8s" repeatCount="indefinite" path="M-10 200 C 300 160 520 240 760 190 S 1050 230 1210 180"/></circle>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="20" fill="none" stroke="url(#brand)" stroke-opacity=".45"/>

  <!-- left: identity -->
  <g class="sans">
    <g class="in d1">
      <rect x="64" y="58" width="262" height="30" rx="15" fill="#22D3EE" fill-opacity=".10" stroke="#22D3EE" stroke-opacity=".45"/>
      <circle class="pulse" cx="84" cy="73" r="5" fill="#34D399"/>
      <text x="98" y="78.5" class="mono" font-size="13" letter-spacing="1.5" fill="#A5F3FC">MIS · DATA · AUTOMATION</text>
    </g>
    <text class="in d2" x="62" y="160" font-size="68" font-weight="800" letter-spacing="5" fill="url(#brand)">ANJU BARAI</text>
    <text class="in d3" x="64" y="204" font-size="21" font-weight="600" letter-spacing="2.5" fill="#E2E8F0">MIS ANALYST  <tspan fill="#3B82F6">|</tspan>  DATA ANALYST  <tspan fill="#8B5CF6">|</tspan>  AUTOMATION</text>
    <g class="in d4">
      <text x="64" y="262" class="mono" font-size="20" fill="#22D3EE">&gt;</text>
      <g class="mono" font-size="20" fill="#CBD5E1">
        <text class="tag g1" x="88" y="262">Turning data into decisions</text>
        <text class="tag g2" x="88" y="262">Automating recurring reports</text>
        <text class="tag g3" x="88" y="262">Building smarter MIS systems</text>
      </g>
    </g>
  </g>

  <!-- right: mini dashboard -->
  <g transform="translate(800 56)"><g class="in d3">
    <rect width="340" height="228" rx="16" fill="#0B1226" fill-opacity=".78" stroke="#334155"/>
    <circle cx="20" cy="20" r="4" fill="#F87171"/><circle cx="34" cy="20" r="4" fill="#FBBF24"/><circle cx="48" cy="20" r="4" fill="#34D399"/>
    <text x="320" y="24" text-anchor="end" class="mono" font-size="11" fill="#64748B">daily_mis.dash</text>

    <g class="sans">
      <rect x="18" y="40" width="96" height="48" rx="10" fill="#22D3EE" fill-opacity=".08" stroke="#22D3EE" stroke-opacity=".3"/>
      <text x="30" y="60" font-size="10" letter-spacing=".6" fill="#94A3B8">DATA QUALITY</text>
      <rect x="30" y="68" width="72" height="6" rx="3" fill="#1E293B"/>
      <rect x="30" y="68" width="66" height="6" rx="3" fill="#22D3EE"><animate attributeName="width" values="0;66;66" keyTimes="0;.4;1" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="122" y="40" width="96" height="48" rx="10" fill="#3B82F6" fill-opacity=".08" stroke="#3B82F6" stroke-opacity=".3"/>
      <text x="134" y="60" font-size="10" letter-spacing="1" fill="#94A3B8">REPORTS</text>
      <text x="134" y="79" font-size="12" font-weight="700" fill="#93C5FD">AUTOMATED</text>
      <rect x="226" y="40" width="96" height="48" rx="10" fill="#8B5CF6" fill-opacity=".08" stroke="#8B5CF6" stroke-opacity=".3"/>
      <text x="238" y="60" font-size="10" letter-spacing="1" fill="#94A3B8">SLA / TAT</text>
      <circle class="pulse" cx="243" cy="75" r="4" fill="#34D399"/>
      <text x="253" y="79" font-size="12" font-weight="700" fill="#C4B5FD">TRACKED</text>
    </g>

    <g transform="translate(18 104)">
      <path d="M0 104H304" stroke="#1E293B"/>
      <path d="M0 70H304M0 36H304" stroke="#1E293B" stroke-dasharray="3 5"/>
      <rect class="bar"    x="10"  y="44" width="26" height="60" rx="4" fill="#22D3EE" fill-opacity=".85"/>
      <rect class="bar b2" x="60"  y="28" width="26" height="76" rx="4" fill="#38BDF8" fill-opacity=".85"/>
      <rect class="bar b3" x="110" y="52" width="26" height="52" rx="4" fill="#3B82F6" fill-opacity=".85"/>
      <rect class="bar b4" x="160" y="18" width="26" height="86" rx="4" fill="#6366F1" fill-opacity=".85"/>
      <rect class="bar b5" x="210" y="34" width="26" height="70" rx="4" fill="#8B5CF6" fill-opacity=".85"/>
      <rect class="bar b6" x="260" y="10" width="26" height="94" rx="4" fill="#A78BFA" fill-opacity=".85"/>
      <path d="M23 60 L73 40 L123 66 L173 30 L223 44 L273 16 L273 104 L23 104Z" fill="url(#area)" opacity=".5"/>
      <path class="line" d="M23 60 L73 40 L123 66 L173 30 L223 44 L273 16" fill="none" stroke="#F0ABFC" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </g></g>
</svg>
