<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-labelledby="t">
  <title id="t">Thanks for visiting my profile</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#16123A"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#3B82F6"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="170" rx="18"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,'Courier New',monospace}
    .w1{animation:wave 12s linear infinite}
    .w2{animation:wave 18s linear infinite reverse}
    @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-1200px)}}
    .in{opacity:0;animation:in 1.2s ease forwards .2s}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="170" fill="url(#bg)"/>
    <!-- seamless waves: each path is two identical 1200px periods -->
    <path class="w2" d="M0 126 C100 112 200 112 300 126 S500 140 600 126 S800 112 900 126 S1100 140 1200 126 S1400 112 1500 126 S1700 140 1800 126 S2000 112 2100 126 S2300 140 2400 126 V170 H0Z" fill="#8B5CF6" fill-opacity=".14"/>
    <path class="w1" d="M0 138 C100 126 200 126 300 138 S500 150 600 138 S800 126 900 138 S1100 150 1200 138 S1400 126 1500 138 S1700 150 1800 138 S2000 126 2100 138 S2300 150 2400 138 V170 H0Z" fill="#22D3EE" fill-opacity=".14"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="169" rx="18" fill="none" stroke="url(#brand)" stroke-opacity=".4"/>
  <g class="in" text-anchor="middle">
    <text x="600" y="68" class="sans" font-size="30" font-weight="700" letter-spacing="1" fill="url(#brand)">Thanks for visiting my profile</text>
    <text x="600" y="100" class="mono" font-size="14" letter-spacing="3" fill="#94A3B8">DATA · AUTOMATION · INSIGHT</text>
  </g>
</svg>
