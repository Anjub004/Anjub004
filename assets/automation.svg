<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
  <title id="t">Manual reporting to automated decision flow</title>
  <desc id="d">Animated flow: Manual Report to Data Collection to Automation to Validation to Dashboard to Decision, with data moving along a curved path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#16123A"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#3B82F6"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <linearGradient id="trk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F59E0B"/><stop offset=".22" stop-color="#22D3EE"/><stop offset=".6" stop-color="#3B82F6"/><stop offset="1" stop-color="#F0ABFC"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="route" d="M110 140 C208 140 208 210 306 210 S404 140 502 140 S600 210 698 210 S796 140 894 140 S992 210 1090 210"/>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,'Courier New',monospace}
    .lbl{font-size:15px;font-weight:700;letter-spacing:1.2px;fill:#F1F5F9}
    .flow{stroke-dasharray:5 9;animation:flow 1.1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-14}}
    .spin{animation:spin 6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .drop{animation:drop 1.6s ease-in-out infinite}
    @keyframes drop{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(4px);opacity:0}}
    .tick{stroke-dasharray:40;stroke-dashoffset:40;animation:tick 3s ease-in-out infinite}
    @keyframes tick{0%{stroke-dashoffset:40}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
    .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 2.4s ease-in-out infinite alternate}
    .b2{animation-delay:.4s}.b3{animation-delay:.8s}
    @keyframes grow{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
    .flick{animation:flick 2.2s steps(2) infinite}
    @keyframes flick{50%{opacity:.35}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.4}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.tick{stroke-dashoffset:0}}
  </style>

  <rect width="1200" height="330" rx="18" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="329" rx="18" fill="none" stroke="url(#brand)" stroke-opacity=".4"/>
  <text x="36" y="42" class="mono" font-size="13" letter-spacing="2" fill="#64748B">// MANUAL → AUTOMATED REPORTING</text>

  <use xlink:href="#route" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
  <use xlink:href="#route" class="flow" fill="none" stroke="url(#trk)" stroke-width="2" stroke-linecap="round"/>

  <g filter="url(#glow)">
    <circle r="5.5"><animateMotion dur="7.5s" repeatCount="indefinite"><mpath xlink:href="#route"/></animateMotion><animate attributeName="fill" dur="7.5s" repeatCount="indefinite" values="#F59E0B;#22D3EE;#3B82F6;#34D399;#A78BFA;#F0ABFC"/></circle>
    <circle r="4"><animateMotion dur="7.5s" begin="-2.5s" repeatCount="indefinite"><mpath xlink:href="#route"/></animateMotion><animate attributeName="fill" dur="7.5s" begin="-2.5s" repeatCount="indefinite" values="#F59E0B;#22D3EE;#3B82F6;#34D399;#A78BFA;#F0ABFC"/></circle>
    <circle r="4"><animateMotion dur="7.5s" begin="-5s" repeatCount="indefinite"><mpath xlink:href="#route"/></animateMotion><animate attributeName="fill" dur="7.5s" begin="-5s" repeatCount="indefinite" values="#F59E0B;#22D3EE;#3B82F6;#34D399;#A78BFA;#F0ABFC"/></circle>
  </g>

  <g class="sans" text-anchor="middle">
    <!-- Manual report -->
    <g transform="translate(110 140)">
      <circle r="40" fill="#0F172A" stroke="#F59E0B" stroke-opacity=".7" stroke-width="1.5"/>
      <g fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-linejoin="round">
        <path d="M-11 -16H5L12 -9V16H-11Z"/><path d="M5 -16V-9H12"/>
        <path class="flick" d="M-6 -3H7M-6 3H7M-6 9H2"/>
      </g>
      <text class="lbl" y="-56">MANUAL REPORT</text>
    </g>
    <!-- Data collection -->
    <g transform="translate(306 210)">
      <circle r="40" fill="#0F172A" stroke="#22D3EE" stroke-opacity=".7" stroke-width="1.5"/>
      <g fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-15 4V12H15V4"/>
        <g class="drop"><path d="M0 -14V4M-6 -2L0 4L6 -2"/></g>
      </g>
      <text class="lbl" y="64">DATA COLLECTION</text>
    </g>
    <!-- Automation -->
    <g transform="translate(502 140)">
      <circle r="40" fill="#0F172A" stroke="#3B82F6" stroke-opacity=".8" stroke-width="1.5"/>
      <g class="spin">
        <circle r="15" fill="none" stroke="#60A5FA" stroke-width="7" stroke-dasharray="5.9 5.9"/>
        <circle r="10" fill="none" stroke="#60A5FA" stroke-width="3"/>
      </g>
      <circle r="3.5" fill="#60A5FA"/>
      <text class="lbl" y="-56">AUTOMATION</text>
    </g>
    <!-- Validation -->
    <g transform="translate(698 210)">
      <circle r="40" fill="#0F172A" stroke="#34D399" stroke-opacity=".7" stroke-width="1.5"/>
      <circle r="17" fill="none" stroke="#34D399" stroke-opacity=".35" stroke-width="2"/>
      <path class="tick" d="M-8 0L-2 6L9 -6" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="lbl" y="64">VALIDATION</text>
    </g>
    <!-- Dashboard -->
    <g transform="translate(894 140)">
      <circle r="40" fill="#0F172A" stroke="#A78BFA" stroke-opacity=".7" stroke-width="1.5"/>
      <g fill="#A78BFA">
        <rect class="bar" x="-14" y="-4" width="7" height="16" rx="1.5"/>
        <rect class="bar b2" x="-3.5" y="-14" width="7" height="26" rx="1.5"/>
        <rect class="bar b3" x="7" y="-8" width="7" height="20" rx="1.5"/>
      </g>
      <text class="lbl" y="-56">DASHBOARD</text>
    </g>
    <!-- Decision -->
    <g transform="translate(1090 210)">
      <circle r="40" fill="#0F172A" stroke="#F0ABFC" stroke-opacity=".7" stroke-width="1.5"/>
      <path d="M0 -17L17 0L0 17L-17 0Z" fill="none" stroke="#F0ABFC" stroke-width="2" stroke-linejoin="round"/>
      <circle class="pulse" r="4" fill="#F0ABFC"/>
      <text class="lbl" y="64">DECISION</text>
    </g>
  </g>

  <g class="mono" font-size="12" text-anchor="middle">
    <path d="M266 298V304H1130V298" fill="none" stroke="#334155"/>
    <text x="698" y="322" fill="#64748B" letter-spacing="1">automated · repeatable · auditable</text>
    <text x="110" y="322" fill="#D97706" letter-spacing="1">before</text>
  </g>
</svg>
